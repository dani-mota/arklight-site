<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
.frame{width:780px;height:452px;padding:30px 36px 22px}
.eyebrow{margin-bottom:8px}
.title{font-size:23px;margin-bottom:2px}
.sub{font-family:var(--font-mono);font-size:11px;letter-spacing:.02em;color:var(--ink-3);margin-bottom:6px}
svg{flex:1;width:100%;height:100%}
.gl{stroke:var(--line-soft);stroke-width:1}
.axis{stroke:var(--line);stroke-width:1.5}
.yl{font-family:var(--font-mono);font-size:11px;fill:var(--ink-3)}
.xl{font-family:var(--font-mono);font-size:11.5px;fill:var(--ink-2)}
.val{font-family:var(--font-body);font-weight:700;font-size:19px;fill:var(--ink-0);letter-spacing:-.01em}
.ytitle{font-family:var(--font-mono);font-size:10px;letter-spacing:.04em;fill:var(--ink-3)}
</style></head>
<body>
<div class="frame">
  <div class="eyebrow">The cost of renting</div>
  <h1 class="title">What “renting” a workforce actually costs</h1>
  <div class="sub">Staffing markup over the worker’s base wage</div>
  <svg viewBox="0 0 708 332" preserveAspectRatio="xMidYMid meet">
    <g>
      <line class="gl" x1="64" y1="290" x2="690" y2="290"/>
      <line class="gl" x1="64" y1="251.4" x2="690" y2="251.4"/>
      <line class="gl" x1="64" y1="212.9" x2="690" y2="212.9"/>
      <line class="gl" x1="64" y1="174.3" x2="690" y2="174.3"/>
      <line class="gl" x1="64" y1="135.7" x2="690" y2="135.7"/>
      <line class="gl" x1="64" y1="97.1"  x2="690" y2="97.1"/>
      <line class="gl" x1="64" y1="58.6"  x2="690" y2="58.6"/>
      <line class="gl" x1="64" y1="20"    x2="690" y2="20"/>
      <text class="yl" x="56" y="294" text-anchor="end">0</text>
      <text class="yl" x="56" y="255" text-anchor="end">10</text>
      <text class="yl" x="56" y="217" text-anchor="end">20</text>
      <text class="yl" x="56" y="178" text-anchor="end">30</text>
      <text class="yl" x="56" y="140" text-anchor="end">40</text>
      <text class="yl" x="56" y="101" text-anchor="end">50</text>
      <text class="yl" x="56" y="63"  text-anchor="end">60</text>
      <text class="yl" x="56" y="24"  text-anchor="end">70</text>
    </g>
    <line class="axis" x1="64" y1="290" x2="690" y2="290"/>
    <text class="ytitle" transform="rotate(-90 20 155)" x="20" y="155" text-anchor="middle">Markup over wage (%)</text>

    <!-- range bars -->
    <rect x="149" y="135.7" width="132" height="57.9" rx="2" fill="#C9692A"/>
    <rect x="404" y="58.6"  width="132" height="96.4" rx="2" fill="#B85416"/>
    <text class="val" x="215" y="124" text-anchor="middle">25–40%</text>
    <text class="val" x="470" y="47"  text-anchor="middle">35–60%</text>

    <text class="xl" x="215" y="309" text-anchor="middle">Temp staffing</text>
    <text class="xl" x="215" y="324" text-anchor="middle">markup</text>
    <text class="xl" x="470" y="309" text-anchor="middle">Light-industrial</text>
    <text class="xl" x="470" y="324" text-anchor="middle">markup</text>
  </svg>
</div>
</body></html>
